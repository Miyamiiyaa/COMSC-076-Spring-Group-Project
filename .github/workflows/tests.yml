name: Tests

on:
  pull_request:
    branches: [main]

permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  test:
    name: Run JUnit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile sources
        run: |
          mkdir -p build/classes
          find src -name "*.java" > sources.txt
          javac -d build/classes @sources.txt

      - name: Compile tests
        run: |
          mkdir -p build/test-classes
          find tests -name "*.java" > test-sources.txt
          javac -d build/test-classes \
                -cp "build/classes:lib/junit-platform-console-standalone-1.13.0-M3.jar" \
                @test-sources.txt

      - name: Run tests
        run: |
          java -jar lib/junit-platform-console-standalone-1.13.0-M3.jar execute \
               --class-path "build/classes:build/test-classes" \
               --scan-class-path \
               --reports-dir=build/test-results \
               --details=tree \
            || true

      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'build/test-results/TEST-*.xml'
          fail_on_failure: true
          require_tests: true
          detailed_summary: true
          check_name: 'Test results'